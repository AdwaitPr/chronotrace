# Redis Configuration for ChronoTrace 30-Second Keyframe Store
port 6379
bind 0.0.0.0
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory management capped for Apple Silicon / local development (<256MB)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence settings
save 300 1
save 60 100
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
