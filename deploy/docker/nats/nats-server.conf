# NATS JetStream Configuration for ChronoTrace Ingestion
port: 4222
http_port: 8222
server_name: "chronotrace-nats"

jetstream {
    store_dir: "/data/jetstream"
    max_mem: 268435456 # 256MB RAM cap
    max_file: 10737418240 # 10GB Disk
}

# Limits for bounded memory footprint
max_payload: 8388608 # 8MB max message payload
max_connections: 50000
ping_interval: "20s"
ping_max: 3
